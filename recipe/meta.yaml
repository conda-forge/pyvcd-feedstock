{% set name = "pyvcd" %}
{% set version = "0.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 49d69fdd8483b7c38ba61ceee0bf598193d649fabcead0a9bcba93c388a9e101

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - vcd

about:
  home: https://pypi.org/project/pyvcd
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: The PyVCD package writes Value Change Dump (VCD) files as specified in IEEE 1364-2005.

  doc_url: http://pyvcd.readthedocs.io/en/latest/
  dev_url: https://github.com/SanDisk-Open-Source/pyvcd

extra:
  recipe-maintainers:
    - TimSnyder
    - davidbrochart
